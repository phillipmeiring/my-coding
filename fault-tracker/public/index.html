<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fault Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Fault Tracker</h1>
    <nav>
      <button id="tabTenant" class="tab active">Tenant</button>
      <button id="tabLandlord" class="tab">
        Landlord <span id="unreadBadge" class="badge" hidden>0</span>
      </button>
    </nav>
  </header>

  <main>
    <section id="tenantView">
      <h2>Log a fault</h2>
      <form id="faultForm">
        <label>
          Your name
          <input type="text" name="tenantName" required />
        </label>
        <label>
          Unit
          <input type="text" name="unit" placeholder="e.g. Apt 4B" required />
        </label>
        <label>
          Title
          <input type="text" name="title" placeholder="e.g. Leaking kitchen tap" required />
        </label>
        <label>
          Description
          <textarea name="description" rows="3"></textarea>
        </label>
        <button type="submit">Submit fault</button>
      </form>
      <p id="tenantMessage" role="status"></p>
    </section>

    <section id="landlordView" hidden>
      <h2>Reported faults</h2>
      <table id="faultsTable">
        <thead>
          <tr>
            <th>Unit</th>
            <th>Tenant</th>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Reported</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="faultsBody"></tbody>
      </table>
      <p id="landlordEmpty" hidden>No faults reported yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
