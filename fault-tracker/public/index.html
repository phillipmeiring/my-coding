<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fault Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Fault Tracker</h1>
    <nav id="userNav" hidden>
      <span id="userLabel"></span>
      <span id="unreadBadge" class="badge" hidden>0</span>
      <button id="logoutBtn" class="tab">Log out</button>
    </nav>
  </header>

  <main>
    <section id="authView">
      <div class="authTabs">
        <button id="tabLogin" class="tab active">Log in</button>
        <button id="tabRegister" class="tab">Register</button>
      </div>

      <form id="loginForm">
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Password
          <input type="password" name="password" required />
        </label>
        <button type="submit">Log in</button>
      </form>

      <form id="registerForm" hidden>
        <label>
          Name
          <input type="text" name="name" required />
        </label>
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Password
          <input type="password" name="password" minlength="8" required />
        </label>
        <label>
          I am a
          <select name="role" id="registerRole">
            <option value="tenant">Tenant</option>
            <option value="landlord">Landlord</option>
          </select>
        </label>
        <label id="unitField">
          Unit
          <input type="text" name="unit" placeholder="e.g. Apt 4B" />
        </label>
        <button type="submit">Create account</button>
      </form>
      <p id="authMessage" role="status"></p>
    </section>

    <section id="tenantView" hidden>
      <h2>Log a fault</h2>
      <form id="faultForm">
        <label>
          Title
          <input type="text" name="title" placeholder="e.g. Leaking kitchen tap" required />
        </label>
        <label>
          Description
          <textarea name="description" rows="3"></textarea>
        </label>
        <button type="submit">Submit fault</button>
      </form>
      <p id="tenantMessage" role="status"></p>

      <h2>My reported faults</h2>
      <table id="myFaultsTable">
        <thead>
          <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Reported</th>
          </tr>
        </thead>
        <tbody id="myFaultsBody"></tbody>
      </table>
      <p id="myFaultsEmpty" hidden>You haven't reported any faults yet.</p>
    </section>

    <section id="landlordView" hidden>
      <h2>Reported faults</h2>
      <table id="faultsTable">
        <thead>
          <tr>
            <th>Unit</th>
            <th>Tenant</th>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Reported</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="faultsBody"></tbody>
      </table>
      <p id="landlordEmpty" hidden>No faults reported yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
